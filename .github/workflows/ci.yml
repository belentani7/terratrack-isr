name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Sintaxis JavaScript (node --check)
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: HTML minimo (doctype y viewport)
        run: |
          grep -qi '<!doctype html' index.html
          grep -qi 'name="viewport"' index.html
      - name: Tests (node --test)
        run: node --test tests/
